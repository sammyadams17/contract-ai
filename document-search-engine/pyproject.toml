[project]
name = "document-search-engine"
version = "0.1.0"
description = "Agentic search over a fixed contract library: cited answers from the documents that still govern."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "azure-identity>=1.17",
]

[project.scripts]
document-search = "document_search.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_search"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
