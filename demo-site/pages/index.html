<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract AI demos</title>
<style>
  body { margin:0; font:16px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#1c2430; background:#f6f8fa; }
  .wrap { max-width:980px; margin:0 auto; padding:48px 28px; }
  h1 { font-size:26px; margin:0 0 8px; } .lead { color:#5d6b7a; margin:0 0 30px; max-width:720px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:18px; }
  button.card { display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; width:100%; text-align:left; font:inherit; cursor:pointer; background:#fff; border:1px solid #e3e8ee; border-radius:12px; padding:22px; color:inherit; text-decoration:none; }
  button.card:hover { border-color:#0b5cad; box-shadow:0 2px 10px rgba(11,92,173,.08); }
  .card b { display:block; font-size:17px; margin-bottom:6px; } .card span { color:#5d6b7a; font-size:14px; }
  .card .go { display:block; margin-top:auto; padding-top:12px; color:#0b5cad; font-weight:600; font-size:14px; }
  .foot { color:#5d6b7a; font-size:13px; margin-top:36px; }
</style>
</head>
<body><div class="wrap">
  <h1>Contract AI demos</h1>
  <p class="lead">Two engines for legal work on contracts, each usable on its own. Each demo replays a real run on invented documents: nothing to set up.</p>
  <div class="cards">
    <button class="card" data-go="drafting"><b>Contract drafting engine</b><span>A term sheet and the client's template in, a first-draft contract out as a Word redline, every change explained.</span><div class="go">Open the demo →</div></button>
    <button class="card" data-go="search"><b>Document search engine</b><span>Ask a library of signed contracts; the agent reads every document that could change the answer, and cites the page.</span><div class="go">Open the demo →</div></button>
  </div>
  <p class="foot">All parties, documents and figures are invented.</p>
</div>
<script>
// one file: the page switches views; as separate files: it opens the page
document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () =>
  window.__go ? window.__go(b.dataset.go) : (location.href = b.dataset.go + ".html")));
</script></body>
</html>
