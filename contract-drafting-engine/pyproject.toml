[project]
name = "drafting-engine"
version = "0.1.0"
description = "Agentic contract drafting: a term sheet and a base document in, a Word redline out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adeu>=1.30.0",
    "docx-redline>=1.0.3",
    "python-docx>=1.1",
    "pydantic>=2.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "pypdf>=5.1",
    "azure-identity>=1.17",
]

[project.scripts]
drafting-engine = "drafting_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drafting_engine"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B023"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
